name: Build NexHash EdgeOS 2.2 PRODUCT FINAL

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nexhash-edgeos-v21-build.yml'
      - '.github/scripts/nexhash-v21-patch.sh'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Download validated NexHash EdgeOS 2.0 ISO
        uses: actions/download-artifact@v4
        with:
          name: NexHash-EdgeOS-2.0-FINAL-Install-amd64
          path: source-artifact
          run-id: 37105685465
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Unpack source artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          find source-artifact -type f -maxdepth 2 -print
          ISO="$(find source-artifact -type f -name '*.iso' | head -n1)"
          test -s "$ISO"
          cp "$ISO" source/NexHash-EdgeOS-2.0-FINAL-Install-amd64.iso

      - name: Build and validate NexHash EdgeOS 2.2 Product Final
        shell: bash
        run: bash .github/scripts/nexhash-v21-patch.sh source out

      - name: Upload final ISO
        uses: actions/upload-artifact@v4
        with:
          name: NexHash-EdgeOS-2.2-PRODUCT-FINAL-Install-amd64
          path: |
            out/NexHash-EdgeOS-2.2-PRODUCT-FINAL-Install-amd64.iso
            out/NexHash-EdgeOS-2.2-PRODUCT-FINAL-Install-amd64.iso.sha256
            out/FINAL-VALIDATED.txt
          compression-level: 0
          retention-days: 3

      - name: Upload split ISO
        uses: actions/upload-artifact@v4
        with:
          name: NexHash-EdgeOS-2.2-PRODUCT-FINAL-parts
          path: |
            out/final-part-*
            out/final-parts.sha256
          compression-level: 0
          retention-days: 3
