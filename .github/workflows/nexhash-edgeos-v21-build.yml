name: Build NexHash EdgeOS 2.5 APPLIANCE FINAL

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nexhash-edgeos-v21-build.yml'
      - '.github/scripts/nexhash-v21-patch.sh'
      - '.github/scripts/nexhash-v25-appliance.sh'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Fetch private NexHash V1.5 application bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bundle
          curl -fL --retry 5 --retry-delay 2 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-592c-820e-87e7-204e46681fab/raw?se=2026-10-04T14%3A13%3A08Z&sp=r&sv=2026-02-06&sr=b&scid=a9896b7d-f483-5589-91c5-821d40cdea92&skoid=db6dad9e-03ee-465b-aef6-ce0f63a161dc&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-03T19%3A02%3A11Z&ske=2026-10-04T19%3A02%3A11Z&sks=b&skv=2026-02-06&sig=pezgEhmmSSW0ki0S0K0/1kEmLSjUDuAE2N1q13PfKsQ%3D' \
            -o bundle/NexHash-v5.2.2-Commercial-V1.5-Production-Cloud.zip
          test -s bundle/NexHash-v5.2.2-Commercial-V1.5-Production-Cloud.zip
          unzip -tq bundle/NexHash-v5.2.2-Commercial-V1.5-Production-Cloud.zip
          sha256sum bundle/NexHash-v5.2.2-Commercial-V1.5-Production-Cloud.zip

      - name: Download NexHash EdgeOS 2.2 product-final base
        uses: actions/download-artifact@v4
        with:
          name: NexHash-EdgeOS-2.2-PRODUCT-FINAL-Install-amd64
          path: source-artifact
          run-id: 37130279416
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Unpack source artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          find source-artifact -type f -maxdepth 2 -print
          ISO="$(find source-artifact -type f -name '*.iso' | head -n1)"
          test -s "$ISO"
          cp "$ISO" source/NexHash-EdgeOS-2.2-PRODUCT-FINAL-Install-amd64.iso

      - name: Build and validate NexHash EdgeOS 2.5 Appliance Final
        shell: bash
        run: bash .github/scripts/nexhash-v21-patch.sh source out

      - name: Upload final ISO
        uses: actions/upload-artifact@v4
        with:
          name: NexHash-EdgeOS-2.5-APPLIANCE-FINAL-Install-amd64
          path: |
            out/NexHash-EdgeOS-2.5-APPLIANCE-FINAL-Install-amd64.iso
            out/NexHash-EdgeOS-2.5-APPLIANCE-FINAL-Install-amd64.iso.sha256
            out/FINAL-VALIDATED.txt
          compression-level: 0
          retention-days: 3

      - name: Upload split ISO
        uses: actions/upload-artifact@v4
        with:
          name: NexHash-EdgeOS-2.5-APPLIANCE-FINAL-parts
          path: |
            out/final-part-*
            out/final-parts.sha256
          compression-level: 0
          retention-days: 3
