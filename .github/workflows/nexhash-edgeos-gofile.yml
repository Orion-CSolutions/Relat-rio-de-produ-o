name: Host NexHash EdgeOS ISO

on:
  push:
    branches:
      - nexhash-edgeos-temp-build
    paths:
      - '.github/workflows/nexhash-edgeos-gofile.yml'

permissions:
  actions: read
  contents: read

jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ARTIFACT_ID: "11260261814"
      ISO: "NexHash-EdgeOS-1.1-Industrial-amd64.iso"
    steps:
      - name: Download and verify ISO
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release
          curl -fL --retry 3 --retry-delay 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o /tmp/nexhash-artifact.zip
          unzip -j /tmp/nexhash-artifact.zip "${ISO}" "${ISO}.sha256" "BUILD-VALIDATED.txt" -d release
          cd release
          sha256sum -c "${ISO}.sha256"
          grep -qi "validated" BUILD-VALIDATED.txt
          ls -lh "${ISO}"

      - name: Upload single ISO to Gofile
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS --retry 3 --retry-delay 5 \
            -F "file=@release/${ISO};type=application/x-iso9660-image" \
            https://upload.gofile.io/uploadfile)"
          status="$(printf '%s' "$response" | jq -r '.status')"
          test "$status" = "ok"
          page="$(printf '%s' "$response" | jq -r '.data.downloadPage')"
          folder="$(printf '%s' "$response" | jq -r '.data.parentFolder')"
          token="$(printf '%s' "$response" | jq -r '.data.guestToken // empty')"
          test -n "$page"
          if [[ -n "$folder" && -n "$token" ]]; then
            curl -fsS --retry 3 --retry-delay 3 \
              -F "file=@release/${ISO}.sha256;type=text/plain" \
              -F "folderId=${folder}" \
              -F "token=${token}" \
              https://upload.gofile.io/uploadfile >/dev/null
          fi
          echo "NEXHASH_GOFILE_URL=${page}"
          echo "NEXHASH_SHA256=$(awk '{print $1}' release/${ISO}.sha256)"
