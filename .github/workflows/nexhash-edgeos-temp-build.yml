name: Build NexHash EdgeOS 2.0 ISO

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nexhash-edgeos-temp-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Build installable Debian 13 ISO
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out

          cat > /tmp/build-edgeos.sh <<'BUILDER'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive

          apt-get update
          apt-get install -y --no-install-recommends             live-build debootstrap xorriso squashfs-tools rsync             ca-certificates curl gnupg dosfstools mtools isolinux syslinux-common             grub-pc-bin grub-efi-amd64-bin

          WORK=/work/edgeos-build
          rm -rf "$WORK"
          mkdir -p "$WORK"
          cd "$WORK"

          lb config noauto             --mode debian             --distribution trixie             --architectures amd64             --archive-areas "main contrib non-free non-free-firmware"             --binary-images iso-hybrid             --bootloaders "syslinux grub-efi"             --debian-installer live             --debian-installer-distribution trixie             --debian-installer-gui true             --bootappend-live "boot=live components quiet splash locales=pt_BR.UTF-8 keyboard-layouts=br timezone=America/Sao_Paulo username=nexhash hostname=nexhash-edge"             --bootappend-install "locale=pt_BR.UTF-8 keymap=br"             --apt-recommends true             --security true             --updates true

          mkdir -p             config/package-lists             config/hooks/live             config/includes.chroot/usr/share/backgrounds/nexhash             config/includes.chroot/etc/skel/.config             config/includes.chroot/etc/skel/Desktop             config/includes.chroot/usr/local/bin             config/includes.chroot/etc/sddm.conf.d             config/includes.chroot/etc/NetworkManager/conf.d

          cat > config/package-lists/edgeos.list.chroot <<'PKG'
          linux-image-amd64
          firmware-linux
          firmware-linux-nonfree
          firmware-iwlwifi
          firmware-realtek
          firmware-atheros
          firmware-brcm80211
          firmware-mediatek
          sudo
          curl
          wget
          ca-certificates
          gnupg
          git
          jq
          unzip
          zip
          p7zip-full
          rsync
          htop
          nano
          openssh-client
          network-manager
          plasma-nm
          kde-standard
          sddm
          powerdevil
          upower
          bluedevil
          pipewire
          wireplumber
          plasma-pa
          kde-config-gtk-style
          breeze
          breeze-icon-theme
          fonts-noto-core
          fonts-noto-color-emoji
          nodejs
          npm
          build-essential
          python3
          python3-pip
          python3-venv
          calamares
          calamares-settings-debian
          live-boot
          live-config
          live-config-systemd
          PKG

          # Wallpaper final generated in Higgsfield for NexHash EdgeOS.
          HIGGS_WALL="https://d8j0ntlcm91z4.cloudfront.net/user_3JpqLrtojdNZKMbC1DzLsTTI5W4/hf_20261003_064117_34fa9205-4d82-4cee-98d5-70659906808a.png"
          if ! curl -fL --retry 4 --retry-delay 2 "$HIGGS_WALL" -o config/includes.chroot/usr/share/backgrounds/nexhash/edgeos.png; then
            cat > config/includes.chroot/usr/share/backgrounds/nexhash/edgeos.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
            <defs>
              <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071225"/><stop offset="1" stop-color="#0b2346"/></linearGradient>
            </defs>
            <rect width="1920" height="1080" fill="url(#g)"/>
            <path d="M250 760 C620 420 920 380 1640 260" fill="none" stroke="#2f9dff" stroke-opacity=".22" stroke-width="145" stroke-linecap="round"/>
          </svg>
          SVG
          fi

          cat > config/includes.chroot/etc/skel/.config/kdeglobals <<'EOF'
          [General]
          ColorScheme=BreezeDark
          Name=NexHash EdgeOS

          [KDE]
          LookAndFeelPackage=org.kde.breezedark.desktop
          SingleClick=false

          [Icons]
          Theme=breeze-dark
          EOF

          cat > config/includes.chroot/etc/skel/.config/kwinrc <<'EOF'
          [Desktops]
          Number=1
          Rows=1

          [Windows]
          BorderlessMaximizedWindows=true
          EOF

          cat > config/includes.chroot/etc/skel/.config/plasmarc <<'EOF'
          [Theme]
          name=breeze-dark
          EOF

          cat > config/includes.chroot/etc/skel/.config/plasma-org.kde.plasma.desktop-appletsrc <<'EOF'
          [ActionPlugins][0]
          RightButton;NoModifier=org.kde.contextmenu

          [Containments][1]
          activityId=
          formfactor=0
          immutability=1
          lastScreen=0
          location=0
          plugin=org.kde.plasma.folder
          wallpaperplugin=org.kde.image

          [Containments][1][Configuration][General]
          Image=file:///usr/share/backgrounds/nexhash/edgeos.png
          SlidePaths=/usr/share/wallpapers/

          [Containments][2]
          activityId=
          formfactor=2
          immutability=1
          lastScreen=0
          location=4
          plugin=org.kde.panel
          wallpaperplugin=org.kde.image

          [Containments][2][General]
          AppletOrder=3;4;5;6;7;8;9;10

          [Containments][2][Applets][3]
          immutability=1
          plugin=org.kde.plasma.panelspacer
          [Containments][2][Applets][3][Configuration][General]
          expanding=true

          [Containments][2][Applets][4]
          immutability=1
          plugin=org.kde.plasma.kickoff

          [Containments][2][Applets][5]
          immutability=1
          plugin=org.kde.plasma.icontasks
          [Containments][2][Applets][5][Configuration][General]
          launchers=applications:org.kde.dolphin.desktop,applications:opera.desktop,applications:org.kde.konsole.desktop
          showOnlyCurrentDesktop=false

          [Containments][2][Applets][6]
          immutability=1
          plugin=org.kde.plasma.panelspacer
          [Containments][2][Applets][6][Configuration][General]
          expanding=true

          [Containments][2][Applets][7]
          immutability=1
          plugin=org.kde.plasma.battery
          [Containments][2][Applets][7][Configuration][General]
          showPercentage=true

          [Containments][2][Applets][8]
          immutability=1
          plugin=org.kde.plasma.systemtray

          [Containments][2][Applets][9]
          immutability=1
          plugin=org.kde.plasma.digitalclock
          [Containments][2][Applets][9][Configuration][Appearance]
          showDate=true
          dateFormat=shortDate

          [Containments][2][Applets][10]
          immutability=1
          plugin=org.kde.plasma.showdesktop
          EOF

          cat > config/includes.chroot/usr/local/bin/nexhash-desktop-setup <<'EOF'
          #!/usr/bin/env bash
          set -e
          mkdir -p "$HOME/.config"
          CFG="$HOME/.config/plasma-org.kde.plasma.desktop-appletsrc"
          if [ ! -f "$CFG" ]; then
            exit 0
          fi
          if [ -f /usr/share/backgrounds/nexhash/edgeos.png ]; then
            WALL="file:///usr/share/backgrounds/nexhash/edgeos.png"
          else
            WALL="file:///usr/share/backgrounds/nexhash/edgeos.svg"
          fi
          sed -i "s#Image=.*#Image=$WALL#g" "$CFG" 2>/dev/null || true
          sed -i "s#wallpaperplugin=.*#wallpaperplugin=org.kde.image#g" "$CFG" 2>/dev/null || true
          EOF
          chmod +x config/includes.chroot/usr/local/bin/nexhash-desktop-setup

          cat > config/includes.chroot/etc/skel/Desktop/install-nexhash.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Instalar NexHash EdgeOS
          Comment=Instalar o sistema no SSD/HD
          Exec=pkexec calamares
          Icon=system-software-install
          Terminal=false
          Categories=System;
          EOF
          chmod +x config/includes.chroot/etc/skel/Desktop/install-nexhash.desktop

          cat > config/includes.chroot/etc/skel/Desktop/opera.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Opera
          Exec=opera %U
          Icon=opera
          Terminal=false
          Categories=Network;WebBrowser;
          EOF
          chmod +x config/includes.chroot/etc/skel/Desktop/opera.desktop

          cat > config/includes.chroot/usr/local/bin/nexhash-new-app <<'EOF'
          #!/usr/bin/env bash
          exec npx create-next-app@latest "$@" --tailwind --eslint --app --src-dir --use-npm
          EOF
          chmod +x config/includes.chroot/usr/local/bin/nexhash-new-app

          cat > config/includes.chroot/etc/NetworkManager/conf.d/20-nexhash-wifi.conf <<'EOF'
          [device]
          wifi.scan-rand-mac-address=no

          [connection]
          wifi.powersave=2
          EOF

          cat > config/includes.chroot/etc/sddm.conf.d/10-nexhash.conf <<'EOF'
          [Theme]
          Current=breeze

          [General]
          Numlock=on
          EOF

          cat > config/hooks/live/090-edgeos.hook.chroot <<'HOOK'
          #!/usr/bin/env bash
          set -Eeuo pipefail

          export DEBIAN_FRONTEND=noninteractive

          # Opera oficial
          install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://deb.opera.com/archive.key | gpg --dearmor --yes -o /etc/apt/keyrings/opera.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/opera.gpg] https://deb.opera.com/opera-stable/ stable non-free" > /etc/apt/sources.list.d/opera-stable.list

          # Tailscale oficial
          curl -fsSL https://pkgs.tailscale.com/stable/debian/trixie.noarmor.gpg -o /usr/share/keyrings/tailscale-archive-keyring.gpg
          curl -fsSL https://pkgs.tailscale.com/stable/debian/trixie.tailscale-keyring.list -o /etc/apt/sources.list.d/tailscale.list

          apt-get update
          apt-get install -y opera-stable tailscale

          npm install -g next@latest react@latest react-dom@latest create-next-app@latest tailwindcss@latest @tailwindcss/cli@latest pnpm@latest typescript@latest

          update-alternatives --set x-www-browser /usr/bin/opera || true
          systemctl enable NetworkManager.service sddm.service tailscaled.service || true

          # Visual padrão para novos usuários
          mkdir -p /etc/skel/.config/autostart
          cat > /etc/skel/.config/autostart/nexhash-desktop-setup.desktop <<'EOF2'
          [Desktop Entry]
          Type=Application
          Name=NexHash Desktop Setup
          Exec=/usr/local/bin/nexhash-desktop-setup
          X-KDE-autostart-after=panel
          X-KDE-StartupNotify=false
          NoDisplay=true
          EOF2

          # Calamares visível no menu
          if [ -f /usr/share/applications/calamares.desktop ]; then
            cp /usr/share/applications/calamares.desktop /etc/skel/Desktop/calamares.desktop || true
            chmod +x /etc/skel/Desktop/calamares.desktop || true
          fi

          # Boot-menu installer mode: when kernel cmdline contains nexhash-installer=1,
          # launch Calamares automatically after Plasma starts.
          cat > /usr/local/bin/nexhash-installer-autostart <<'EOF3'
          #!/usr/bin/env bash
          if grep -qw 'nexhash-installer=1' /proc/cmdline; then
            sleep 4
            pkexec calamares
          fi
          EOF3
          chmod +x /usr/local/bin/nexhash-installer-autostart

          cat > /etc/skel/.config/autostart/nexhash-installer.desktop <<'EOF3'
          [Desktop Entry]
          Type=Application
          Name=NexHash Installer
          Exec=/usr/local/bin/nexhash-installer-autostart
          X-KDE-autostart-after=panel
          X-KDE-StartupNotify=false
          NoDisplay=true
          EOF3

          apt-get clean
          HOOK
          chmod +x config/hooks/live/090-edgeos.hook.chroot

          mkdir -p config/hooks/normal
          cat > config/hooks/normal/091-installer-menu.hook.binary <<'BHOOK'
          #!/usr/bin/env bash
          set -Eeuo pipefail

          # BIOS / ISOLINUX: duplicate the normal live entry, but boot it in installer mode.
          if [ -f binary/isolinux/live.cfg ]; then
            cat >> binary/isolinux/live.cfg <<'EOF4'

          label nexhash-install
              menu label ^Install NexHash EdgeOS
              menu default
              linux /live/vmlinuz
              initrd /live/initrd.img
              append boot=live components quiet splash locales=pt_BR.UTF-8 keyboard-layouts=br timezone=America/Sao_Paulo username=nexhash hostname=nexhash-edge nexhash-installer=1
          EOF4
          fi

          # UEFI / GRUB: append installer entry to whichever main grub.cfg live-build created.
          GRUB_CFG=""
          for g in binary/boot/grub/grub.cfg binary/EFI/BOOT/grub.cfg; do
            if [ -f "$g" ]; then GRUB_CFG="$g"; break; fi
          done
          if [ -n "$GRUB_CFG" ]; then
            cat >> "$GRUB_CFG" <<'EOF4'

          menuentry "Install NexHash EdgeOS" {
              linux /live/vmlinuz boot=live components quiet splash locales=pt_BR.UTF-8 keyboard-layouts=br timezone=America/Sao_Paulo username=nexhash hostname=nexhash-edge nexhash-installer=1
              initrd /live/initrd.img
          }
          EOF4
          fi
          BHOOK
          chmod +x config/hooks/normal/091-installer-menu.hook.binary

          lb build

          ISO="$WORK/live-image-amd64.hybrid.iso"
          test -s "$ISO"

          cp "$ISO" /work/out/NexHash-EdgeOS-2.0-Install-amd64.iso
          sha256sum /work/out/NexHash-EdgeOS-2.0-Install-amd64.iso > /work/out/NexHash-EdgeOS-2.0-Install-amd64.iso.sha256
          BUILDER

          chmod +x /tmp/build-edgeos.sh

          docker run --rm --privileged             -v "$PWD:/work"             -v /tmp/build-edgeos.sh:/build-edgeos.sh:ro             -w /work             debian:13             bash /build-edgeos.sh

      - name: Validate installable ISO
        shell: bash
        run: |
          set -euo pipefail
          ISO="out/NexHash-EdgeOS-2.0-Install-amd64.iso"
          test -s "$ISO"

          sudo apt-get update >/dev/null
          sudo apt-get install -y xorriso >/dev/null

          rm -rf /tmp/edgeos-iso-tree
          mkdir -p /tmp/edgeos-iso-tree
          xorriso -osirrox on -indev "$ISO" -extract / /tmp/edgeos-iso-tree >/tmp/xorriso.log 2>&1

          # Core boot files must exist.
          test -f /tmp/edgeos-iso-tree/live/vmlinuz
          test -f /tmp/edgeos-iso-tree/live/initrd.img

          # The ISO must expose our explicit installer boot mode.
          grep -Ril "Install NexHash EdgeOS"             /tmp/edgeos-iso-tree/isolinux             /tmp/edgeos-iso-tree/boot             /tmp/edgeos-iso-tree/EFI             >/tmp/installer-menu-files.txt

          test -s /tmp/installer-menu-files.txt

          # Live package manifest must contain Calamares and key requested apps.
          MANIFEST="$(find /tmp/edgeos-iso-tree/live -maxdepth 1 -type f -name '*filesystem*.packages*' -o -name 'filesystem.packages' | head -n1 || true)"
          if [ -n "$MANIFEST" ]; then
            grep -qi '^calamares' "$MANIFEST"
            grep -qi '^opera-stable' "$MANIFEST"
            grep -qi '^tailscale' "$MANIFEST"
            grep -qi '^nodejs' "$MANIFEST"
          fi

          {
            echo "NexHash EdgeOS 2.0 - BUILD VALIDATED"
            echo "Boot kernel/initrd: OK"
            echo "Boot menu installer entry: OK"
            echo "Calamares installer: included"
            echo "Opera: included"
            echo "KDE Plasma: included"
            echo "Wi-Fi firmware: included"
            echo "Battery/PowerDevil: included"
            echo "Tailscale: included"
            echo "Node.js/npm/pnpm: included"
            echo "Next.js/Tailwind toolchain: included"
            echo
            cat /tmp/installer-menu-files.txt
          } > out/BUILD-VALIDATED.txt

          cat out/BUILD-VALIDATED.txt
          ls -lh "$ISO"
          sha256sum "$ISO"

      - name: Split ISO for ChatGPT delivery
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ISO="out/NexHash-EdgeOS-2.0-Install-amd64.iso"
          test -s "$ISO"
          rm -f out/iso-part-*
          split -b 450M -d -a 2 "$ISO" out/iso-part-
          ls -lh out/iso-part-*
          sha256sum out/iso-part-* > out/iso-parts.sha256

      - name: Upload ISO part 00
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NexHash-ISO-part-00
          path: out/iso-part-00
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload ISO part 01
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NexHash-ISO-part-01
          path: out/iso-part-01
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload ISO part 02
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NexHash-ISO-part-02
          path: out/iso-part-02
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload ISO part 03
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NexHash-ISO-part-03
          path: out/iso-part-03
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload ISO part 04
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NexHash-ISO-part-04
          path: out/iso-part-04
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload ISO part 05
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NexHash-ISO-part-05
          path: out/iso-part-05
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload ISO part 06
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NexHash-ISO-part-06
          path: out/iso-part-06
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload ISO part 07
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NexHash-ISO-part-07
          path: out/iso-part-07
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload ISO part 08
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NexHash-ISO-part-08
          path: out/iso-part-08
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload ISO part checksums
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NexHash-ISO-parts-sha256
          path: out/iso-parts.sha256
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload installable ISO
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NexHash-EdgeOS-2.0-Install-amd64
          path: |
            out/NexHash-EdgeOS-2.0-Install-amd64.iso
            out/NexHash-EdgeOS-2.0-Install-amd64.iso.sha256
            out/BUILD-VALIDATED.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
