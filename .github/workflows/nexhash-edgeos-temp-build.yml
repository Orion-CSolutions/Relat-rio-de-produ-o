name: Publish NexHash EdgeOS ISO

on:
  push:
    branches:
      - nexhash-edgeos-temp-build
    paths:
      - '.github/workflows/nexhash-edgeos-temp-build.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ARTIFACT_ID: "11260261814"
      TAG: "nexhash-edgeos-v1.1.0-industrial"
      ISO: "NexHash-EdgeOS-1.1-Industrial-amd64.iso"
    steps:
      - name: Download validated build artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release
          curl -fL --retry 3 --retry-delay 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o /tmp/nexhash-artifact.zip
          unzip -j /tmp/nexhash-artifact.zip \
            "${ISO}" "${ISO}.sha256" "BUILD-VALIDATED.txt" "boot-report.txt" "iso-file.txt" \
            -d release
          cd release
          sha256sum -c "${ISO}.sha256"
          grep -qi "validated" BUILD-VALIDATED.txt
          grep -Eqi "BIOS|UEFI|El Torito" boot-report.txt
          file "${ISO}"
          ls -lh "${ISO}"

      - name: Publish direct ISO download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" \
              "release/${ISO}" "release/${ISO}.sha256" \
              "release/BUILD-VALIDATED.txt" "release/boot-report.txt" "release/iso-file.txt" \
              --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "nexhash-edgeos-temp-build" \
              --title "NexHash EdgeOS 1.1 Industrial — Forge ISO" \
              --notes "NexHash EdgeOS Industrial 1.1. ISO híbrida amd64 validada para BIOS legado e UEFI. Inclui Opera, Tailscale, Openbox, firewall, watchdog, recuperação de rede, TLP, ZRAM, Calamares e infraestrutura NexHash. Verifique o SHA-256 antes de gravar no pendrive." \
              --prerelease \
              "release/${ISO}" "release/${ISO}.sha256" \
              "release/BUILD-VALIDATED.txt" "release/boot-report.txt" "release/iso-file.txt"
          fi
          gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json url,assets
